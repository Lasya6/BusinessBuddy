steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/businessbuddy-git:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/businessbuddy-git:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli
    entrypoint: gcloud
    args:
      - run
      - deploy
      - businessbuddy-git
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/businessbuddy-git:$COMMIT_SHA
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/businessbuddy-git:$COMMIT_SHA

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  logging: CLOUD_LOGGING_ONLY